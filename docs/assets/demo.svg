<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="streamgrab CLI demo">
  <defs>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
  </defs>
  <rect width="900" height="430" rx="12" fill="url(#term)" stroke="#1f2937"/>
  <rect width="900" height="34" rx="12" fill="#0f172a"/>
  <rect y="22" width="900" height="12" fill="#0f172a"/>
  <circle cx="22" cy="17" r="6" fill="#ef4444"/>
  <circle cx="42" cy="17" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="17" r="6" fill="#22c55e"/>
  <text x="450" y="22" fill="#64748b" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">streamgrab — bash</text>

  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14">
    <text x="28" y="70" fill="#5eead4">$ streamgrab --list https://cdn.example.com/master.m3u8</text>
    <text x="28" y="94" fill="#94a3b8">[info] extractor=hls title='master' formats=1</text>
    <text x="28" y="118" fill="#e2e8f0">title: master</text>
    <text x="28" y="142" fill="#e2e8f0">formats: 1</text>
    <text x="28" y="166" fill="#cbd5e1">  hls-0        hls   mp4  1280x720  720p  2400k</text>

    <text x="28" y="206" fill="#5eead4">$ streamgrab -j 4 -o out https://cdn.example.com/master.m3u8</text>
    <text x="28" y="230" fill="#94a3b8">[info] extractor=hls title='master' formats=1</text>
    <text x="28" y="254" fill="#94a3b8">[info] selected: hls-0  1280x720  720p  2400k  hls</text>
    <text x="28" y="278" fill="#22c55e">[info] saved out.mp4 (7.8 KB)</text>

    <text x="28" y="318" fill="#5eead4">$ streamgrab --audio --mp3 -f bestaudio https://cdn.example.com/v.mpd</text>
    <text x="28" y="342" fill="#94a3b8">[info] selected: a1  a:mp4a.40.2  128k  dash</text>
    <text x="28" y="366" fill="#22c55e">[info] saved track.mp3 (3.1 MB)</text>

    <text x="28" y="404" fill="#475569"># 0 hard deps · pure-Python AES fallback · optional FFmpeg muxing</text>
  </g>
</svg>
