<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="streamgrab — segmented HTTP, HLS, DASH, FFmpeg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0e1428"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- soft radial glow -->
  <circle cx="980" cy="320" r="260" fill="#2dd4bf" opacity="0.06"/>

  <!-- wordmark -->
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial">
    <text x="90" y="300" fill="#f8fafc" font-size="88" font-weight="700" letter-spacing="-2">streamgrab</text>
    <text x="94" y="360" fill="#94a3b8" font-size="26" letter-spacing="1">segmented HTTP · HLS · DASH · FFmpeg</text>
    <text x="94" y="404" fill="#5eead4" font-size="20" font-family="ui-monospace,Menlo,Consolas,monospace">zero runtime dependencies · MIT</text>
  </g>

  <!-- download glyph next to wordmark -->
  <g transform="translate(640,236)" filter="url(#glow)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="url(#teal)" stroke-width="5"/>
    <path d="M0,-16 V8 M-10,-1 L0,9 L10,-1" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-13,17 H13" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- streams -->
  <g fill="none" stroke-linecap="round">
    <path d="M700,170 C820,170 880,250 980,270" stroke="url(#teal)" stroke-width="6" opacity="0.9"/>
    <path d="M700,230 C830,230 890,285 985,300" stroke="url(#indigo)" stroke-width="6" opacity="0.9"/>
    <path d="M700,290 C840,290 900,315 985,330" stroke="url(#teal)" stroke-width="6" opacity="0.7"/>
    <path d="M700,350 C850,350 910,345 985,360" stroke="url(#indigo)" stroke-width="6" opacity="0.6"/>
  </g>

  <!-- segment blocks -->
  <g>
    <rect x="740" y="150" width="54" height="40" rx="6" fill="#111a33" stroke="#2dd4bf"/>
    <rect x="806" y="206" width="54" height="40" rx="6" fill="#111a33" stroke="#6366f1"/>
    <rect x="872" y="262" width="54" height="40" rx="6" fill="#111a33" stroke="#2dd4bf"/>
    <rect x="938" y="318" width="54" height="40" rx="6" fill="#111a33" stroke="#6366f1"/>
  </g>

  <!-- download tray -->
  <g filter="url(#glow)">
    <path d="M1000,250 h150 a14,14 0 0 1 14,14 v70 a14,14 0 0 1 -14,14 h-150 a14,14 0 0 1 -14,-14 v-70 a14,14 0 0 1 14,-14 z" fill="none" stroke="url(#tray)" stroke-width="5"/>
    <path d="M1075,268 V318 M1058,302 L1075,320 L1092,302" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1052,334 H1098" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- corner tag -->
  <text x="1180" y="600" fill="#475569" font-size="16" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">github.com/ayankandar2-ux/streamgrab</text>
</svg>
