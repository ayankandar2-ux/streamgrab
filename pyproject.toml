[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamgrab"
version = "0.1.0"
description = "A modular, dependency-light media download engine: segmented HTTP, HLS and DASH with FFmpeg muxing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "streamgrab contributors" }]
keywords = ["downloader", "hls", "dash", "m3u8", "mpd", "ffmpeg", "video", "audio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
  "Topic :: Internet",
]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=41"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
streamgrab = "streamgrab.cli:main"

[project.urls]
Homepage = "https://github.com/ayankandar2-ux/streamgrab"
Documentation = "https://github.com/ayankandar2-ux/streamgrab/blob/main/docs/ARCHITECTURE.md"
Issues = "https://github.com/ayankandar2-ux/streamgrab/issues"
Changelog = "https://github.com/ayankandar2-ux/streamgrab/releases"

[tool.setuptools.packages.find]
include = ["streamgrab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
